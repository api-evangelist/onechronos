aid: onechronos
name: OneChronos
description: >-
  OneChronos operates AI-powered "Smart Market" alternative trading systems that
  match institutional orders using Nobel Prize-winning combinatorial auction
  techniques and mathematical optimization rather than traditional price-time
  priority matching. Operated by OneChronos Markets LLC, a broker-dealer
  subsidiary of OCX Group Inc., the venue runs point-in-time periodic auctions
  roughly ten times per second across US equities (a dark ATS launched in 2022),
  spot foreign exchange, and UK/EU equities multilateral trading facilities.
  Subscribers connect and submit orders electronically over a modern variant of
  the FIX 4.2 protocol, with "expressive bidding" that lets traders encode custom
  constraints, spreads, pairs, portfolio and hedging strategies into each auction.
