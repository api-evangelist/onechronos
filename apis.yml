apis:
- name: OneChronos US Equities ATS (FIX 4.2)
  description: >-
    Order entry and execution for the OneChronos US equities dark ATS over a
    modern variant of the FIX 4.2 protocol. Standard and Target orders, and
    Expressive Bids, are submitted electronically via FIX over TCP/IP; the ATS
    hosts periodic auctions approximately ten times per second.
  humanURL: https://www.onechronos.com/documentation/fix/fix-42/us-equities/
  properties:
  - type: Documentation
    url: https://www.onechronos.com/documentation/user-manual/us-equities/
  - type: APIReference
    url: https://www.onechronos.com/documentation/fix/fix-42/us-equities/
- name: OneChronos FX Smart Market (FIX 4.2)
  description: >-
    Order entry for the OneChronos spot foreign exchange Smart Market over the
    FIX 4.2 protocol variant, applying the same combinatorial-auction matching
    to global FX.
  humanURL: https://www.onechronos.com/documentation/fix/fix-42/fx/
  properties:
  - type: Documentation
    url: https://www.onechronos.com/documentation/user-manual/fx/
  - type: APIReference
    url: https://www.onechronos.com/documentation/fix/fix-42/fx/
- name: OneChronos European Equities MTF (FIX 4.2)
  description: >-
    Order entry for the OneChronos UK and EU equities multilateral trading
    facilities over the FIX 4.2 protocol variant.
  humanURL: https://www.onechronos.com/documentation/fix/fix-42/european-equities/
  properties:
